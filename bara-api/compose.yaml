services:
  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-6-luna}
      OPENAI_INSTRUCTION_MODEL: ${OPENAI_INSTRUCTION_MODEL:-}
      MONGODB_URI: ${MONGODB_URI:?required}
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: bara-media
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?required}
    networks:
      - default
      - data
    restart: unless-stopped
    init: true
networks:
  data:
    external: true
    name: bara-data
